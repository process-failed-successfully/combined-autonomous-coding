[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "shared*"]

[project]
name = "combined-autonomous-coding"
version = "0.13.0"
description = "Combined Autonomous Coding Agent"
authors = [
    {name = "User", email = "user@example.com"},
]
dependencies = [
    "cuid2>=2.0.0",
    "nanoid>=2.0.0",
    "typeid-python>=0.3.10",
    "pyperclip",
    "typer",
    "jsonpatch",
    "SQLAlchemy",
    "rich",
    "docker",
    "requests",
    "PyYAML",
    "Jinja2",
    "python-dotenv",
    "tenacity",
    "openai",
    "google-cloud-aiplatform",
    "gitpython",
    "prometheus-client",
    "psutil",
    "platformdirs",
    "jaraco.context>=6.1.0",
    "cryptography",
    "bcrypt",
    "jira",
    "textual",
    "watchdog",
    "argcomplete",
    "google-generativeai",
    "sqlparse>=0.4.4",
    "croniter",
    "playwright",
    "pillow",
    "openpyxl",
    "tomlkit",
    "feedparser",
    "websockets",
    "qrcode",
    "pandas",
    "pyarrow",
    "ulid-py",
    "python-barcode",
    "cbor2",
    "msgpack",
    "brotli",
    "zstandard",
    "python-gnupg>=0.5.0",
    "jmespath>=1.0.1",
    "jq>=1.11.0",
    "mnemonic>=0.21",
    "faker>=24.0.0",
    "pyseto>=1.7.0",
]
requires-python = ">=3.11"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]

[tool.flake8]
max-line-length = 160
extend-ignore = ["E501"]
exclude = [".git", "__pycache__", "docs/source/conf.py", "old", "build", "dist", ".venv", "venv"]

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version"
]
major_on_zero = false
branch = "master"
upload_to_pypi = false
upload_to_release = true
build_command = "pip install build && python -m build"
commit_parser = "angular"

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
exclude = ["build/"]
